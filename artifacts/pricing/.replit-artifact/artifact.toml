kind = "web"
previewPath = "/pricing/"
title = "Web Media Hub — Pricing"
version = "1.0.0"
id = "artifacts/pricing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pricing/" ]
localPort = 25880

[services.development]
run = "pnpm --filter @workspace/pricing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pricing", "run", "build" ]
publicDir = "artifacts/pricing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25880"
BASE_PATH = "/pricing/"
